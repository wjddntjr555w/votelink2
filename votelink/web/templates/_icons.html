{# 사이드바·상단바용 최소 stroke 아이콘. 외부 아이콘 폰트·CDN을 쓰지 않는다는
   원칙(§10)을 유지하려고 직접 그린 인라인 SVG 몇 개만 둔다. 장식용이라
   aria-hidden — 옆의 텍스트가 이미 의미를 말한다. #}
{% macro icon(name, size=16) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" class="nav-icon">
  {%- if name == 'dashboard' %}
  <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
  <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
  {%- elif name == 'map' %}
  <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14"/><path d="M15 6v14"/>
  {%- elif name == 'news' %}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/>
  {%- elif name == 'compare' %}
  <path d="M12 3v18"/><path d="M5 7 2 15a3 3 0 0 0 6 0Z"/><path d="M19 7l-3 8a3 3 0 0 0 6 0Z"/>
  {%- elif name == 'nation' %}
  <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/>
  {%- elif name == 'cycle' %}
  <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>
  {%- elif name == 'ops' %}
  <path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/>
  {%- elif name == 'audit' %}
  <path d="M4 5h16M4 12h16M4 19h10"/><circle cx="19" cy="19" r="2"/>
  {%- elif name == 'bell' %}
  <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/>
  {%- endif -%}
</svg>
{% endmacro %}
