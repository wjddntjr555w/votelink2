id: news_pulse
name: 선거구 뉴스 펄스 — 주 단위 기사량·언론사 분포·급증 플래그
inputs: [news_article]
outputs: [news_pulse]
geo_level: sigungu
proposal: docs/proposals/A-002-news-pulse.md

# 2026-09-06: 미검증. 아래 backfill 왜곡 때문에 지금 데이터로는 spike 판정을
#   신뢰할 수 없다. 증분 수집(schedule "0 6 * * *")이 여러 주 쌓이면 그때
#   실측으로 대조하고 올린다.
#   - naver 검색 API 는 검색어당 1,000건 상한이고 sort=date 라, 첫 백필(8,229건)은
#     최근으로 갈수록 기사량이 부풀어 있다 (2026-W36 2,445 vs W25 81). 이 계열의
#     "급증"은 실제 뉴스량이 아니라 상한 아티팩트다. payload.backfill_distorted 가
#     이를 True 로 표시하고, L3 카드가 경고를 띄운다.
#
# 2026-09-13: 재확인, 여전히 미검증.
#   - naver_news --reparse (P-006 person_terms 반영) 가 append 저장 방식과 부딪혀
#     record_id 15,178개가 중복 저장되는 버그를 만들었다 (분석기가 아니라
#     votelink/collect/runner.py 의 --reparse 저장 경로 문제. 근본 수정은 별도
#     제안 필요). 이 분석기는 derived_from 에서 중복을 걸러내지 않아 조용히
#     기사 수를 이중 집계하고 있었다 — 중복 record_id 를 일회성으로 정리
#     (data/shared/records/naver_news.jsonl.bak-dedup 에 정리 전 백업)한 뒤
#     재실행해 격리 0%·멱등(교체 1·신규 0) 확인.
#   - 정리 후에도 backfill_distorted=true 는 그대로다: 2026-08-31/09-07 두 주가
#     각각 3,111 / 3,368건으로 직전 몇 주(약 400~900건) 대비 압도적으로 높다
#     (spike_z 11.73 / 2.67). 증분 수집이 1주 쌓인 정도로는 첫 백필의 상한
#     아티팩트가 아직 안 빠졌다. 원래 조건(여러 주 실측 대조) 그대로 미충족.
verified: false

config:
  default_district: seoul_songpa_gap
  # naver_news 가 수집한 시군구(서울 25개 자치구)마다 대표 선거구 하나. 같은 구의
  # 다른 선거구는 시군구 코드가 같아 산출이 동일하므로 여기 넣지 않는다 —
  # collectors/naver_news/meta.yaml 의 config.districts 와 같은 목록이다.
  districts:
    seoul_songpa_gap: {}
    seoul_jongno: {}
    seoul_jung_seongdong_eul: {}
    seoul_yongsan: {}
    seoul_jung_seongdong_gap: {}
    seoul_gwangjin_gap: {}
    seoul_dongdaemun_gap: {}
    seoul_jungnang_gap: {}
    seoul_seongbuk_gap: {}
    seoul_gangbuk_gap: {}
    seoul_dobong_gap: {}
    seoul_nowon_gap: {}
    seoul_eunpyeong_gap: {}
    seoul_seodaemun_gap: {}
    seoul_mapo_gap: {}
    seoul_yangcheon_gap: {}
    seoul_gangseo_gap: {}
    seoul_guro_gap: {}
    seoul_geumcheon: {}
    seoul_yeongdeungpo_gap: {}
    seoul_dongjak_gap: {}
    seoul_gwanak_gap: {}
    seoul_seocho_gap: {}
    seoul_gangnam_gap: {}
    seoul_gangdong_gap: {}

  common:
    # weekly 에 남길 주 수. 12주면 최근 분기를 본다. 이보다 길게 잡으면 첫 백필의
    # 성긴 꼬리(2020~2023 은 주당 한두 건)가 통계에 섞여 평균이 무의미해진다.
    window_weeks: 12

    # 급증 판정용 직전 창 길이(주). 8주 = 약 두 달. 그보다 짧으면 표준편차가
    # 한두 이벤트에 휘둘리고, 길면 계절성(예: 매년 4월 총선기)이 평균에 눌려
    # 실제 급증을 못 잡는다.
    history_weeks: 8

    # 창이 이 주 수보다 짧으면 z-score 를 내지 않는다 (spike_z=None, spike=False).
    # 시계열 앞부분에서 근거 없는 급증 판정이 나오는 것을 막는다.
    min_history_weeks: 8

    # z-score 가 이 값 이상이면 spike=True. 2.0 = 정규 가정에서 상위 ~2.3%.
    # 1.0 으로 낮추면 평범한 주간 변동도 급증으로 잡혀 플래그가 무의미해진다.
    spike_z_threshold: 2.0

    # 최근 주 기사량이 창 중앙값의 이 배를 넘으면 backfill_distorted=True.
    # 3.0 은 "정상 변동으로 보기 어렵다"의 보수적 경계다. 첫 백필에서 이 플래그가
    # 켜지는 것이 정상이며, 증분 수집이 쌓이면 자연히 꺼진다.
    backfill_distortion_ratio: 3.0
