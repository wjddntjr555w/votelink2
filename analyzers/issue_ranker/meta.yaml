id: issue_ranker
name: 선거구 이슈 랭커 — 뉴스를 어휘집으로 분류해 언급 빈도·최근성으로 랭킹
inputs: [news_article]
outputs: [local_issue]
geo_level: sigungu
proposal: docs/proposals/A-003-issue-ranker.md

# 미검증 (2026-09-06). 분석기 자체는 실측 통과: 입력 8,229 → 산출 1 · 격리 0 ·
#   재실행 시 교체 1·신규 0(멱등) · 불변식 성립 · trend 비중 기반이라 백필 왜곡
#   속에서도 변별력 5 falling / 5 rising.
#   verified 를 올리지 않는 이유는 **표본**이다: naver_news 의 "송파" 검색분은
#   스포츠·행사·인사·부고가 70%+ 이고(미분류 83%), 분류분에도 송파를 스쳐 언급한
#   국가 뉴스(선관위 특검 등)가 섞인다. issue_lexicon.yaml 은 draft 이고 카드에
#   표본 편향 경고를 상시 노출한다. 깨끗한 지역 뉴스 수집기가 생기면 재평가한다.
#
# 2026-09-13: 재확인, 여전히 미검증.
#   - naver_news --reparse (P-006) 가 append 저장과 부딪혀 record_id 15,178개를
#     중복 저장한 상태에서 처음 돌리니 격리율 100%(derived_from 중복 불가 위반)로
#     완전히 실패했다 — news_pulse 와 달리 이 분석기는 중복을 그대로 계산에
#     실어 계약 위반을 시끄럽게 드러냈다(의도한 fail-closed 동작). 근본 원인은
#     votelink/collect/runner.py 의 --reparse 저장 경로(별도 수정 필요, 이
#     분석기 범위 밖). data/shared/records/naver_news.jsonl 을 record_id 기준
#     일회성 정리(백업: naver_news.jsonl.bak-dedup) 후 재실행해 격리 0%·멱등
#     확인 완료.
#   - 정리 후 표본 지표: 입력 167,939 (송파 window 10,398) · unclassified_count
#     8,554 (82.3%) — 2026-09-06 시점의 83%와 사실상 동일하다. 즉 원래
#     verified 를 막은 표본 편향 사유가 이번 재확인에서도 그대로 재현됐다.
#     증분 수집 1주만으로는 해소되지 않는, 검색 소스 자체의 구조적 문제다.
verified: false

config:
  default_district: seoul_songpa_gap
  # naver_news 가 수집한 시군구(서울 25개 자치구)마다 대표 선거구 하나. 같은 구의
  # 다른 선거구는 시군구 코드가 같아 산출이 동일하므로 여기 넣지 않는다 —
  # collectors/naver_news/meta.yaml 의 config.districts 와 같은 목록이다.
  districts:
    seoul_songpa_gap: {}
    seoul_jongno: {}
    seoul_jung_seongdong_eul: {}
    seoul_yongsan: {}
    seoul_jung_seongdong_gap: {}
    seoul_gwangjin_gap: {}
    seoul_dongdaemun_gap: {}
    seoul_jungnang_gap: {}
    seoul_seongbuk_gap: {}
    seoul_gangbuk_gap: {}
    seoul_dobong_gap: {}
    seoul_nowon_gap: {}
    seoul_eunpyeong_gap: {}
    seoul_seodaemun_gap: {}
    seoul_mapo_gap: {}
    seoul_yangcheon_gap: {}
    seoul_gangseo_gap: {}
    seoul_guro_gap: {}
    seoul_geumcheon: {}
    seoul_yeongdeungpo_gap: {}
    seoul_dongjak_gap: {}
    seoul_gwanak_gap: {}
    seoul_seocho_gap: {}
    seoul_gangnam_gap: {}
    seoul_gangdong_gap: {}

  common:
    # 봉투 confidence 하한. 0.7 = 구 단위 이상(~8,229건). 0.9(동·지명 직접)만 쓰면
    # 표본이 절반 이하로 줄어 카테고리별 기사 수가 무의미해진다. 사용자 승인값.
    min_confidence: 0.7

    # 접은 주 수. A-002(news_pulse)와 같은 12. 길면 첫 백필의 성긴 꼬리(2020~2023 은
    # 주당 한두 건)가 최근성·추세 통계에 섞여 평균이 무의미해진다.
    window_weeks: 12

    # recency_score 지수감쇠 반감기(주). 4 = 최근 4주가 8주 전의 2배 무게.
    # 1~2 면 최근 주 하나에 순위가 휘둘리고, 12+ 면 감쇠가 사실상 사라진다.
    half_life_weeks: 4

    # trend: 최근 절반 합 / 이전 절반 합. 이 값 이상이면 rising. 1.3 = "30%+ 증가".
    # 구현 시 실측 민감도를 확인한다 — 전 카테고리가 같은 trend 면(정보량 0)
    # 1.2·1.5 로 바꿔보고 분포가 갈리는지 본 뒤 조정한다 (docs/30-analysis-spec.md §9).
    trend_rising_ratio: 1.3

    # 이 값 이하이면 falling. 1/1.3 ≈ 0.77 로 rising 과 대칭.
    trend_falling_ratio: 0.77

    # 최근 주가 창 중앙값의 이 배를 넘으면 backfill_distorted=true. A-002 와 동일.
    # 첫 백필에서 켜지는 것이 정상이며, 증분 수집이 쌓이면 자연히 꺼진다.
    backfill_distortion_ratio: 3.0

    # 카테고리별 top_places 에 남길 지명 수. 카드 칩이 그 이상 늘어지면 읽기 어렵다.
    top_places_n: 5

    # 카테고리별 대표 헤드라인 수. 계약 상한이 3이다 (payload.sample_headlines).
    sample_headlines_limit: 3
