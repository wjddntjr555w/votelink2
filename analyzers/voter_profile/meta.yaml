id: voter_profile
name: 읍면동 유권자 프로파일 — 진영 성향 시계열 × 인구 구조
inputs: [election_result, population]
outputs: [segment_profile]
geo_level: emd
proposal: docs/proposals/A-001-voter-profile.md

# 2026-09-03: 실제 입력으로 검증 완료.
# 입력 81건(개표 72 + 인구 9) → 산출 9건, 격리 0, 재실행 시 교체 9·신규 0(멱등).
# geo_code 집합이 mois_population · nec_archive 와 정확히 일치한다.
# trend 분포(보수이동 3 / 안정 2 / 진보이동 4)가 독립 민감도 검사 결과와 일치했다.
#
# 2026-09-04: election_type 축 추가 (A-001 변경 이력 참조).
# natural_key 가 voter_profile|<election_type>|<geo_code>|<as_of> 로 바뀌었다 →
# data/records/voter_profile.jsonl 을 1회 삭제 후 재생성 (data/records/ 는 gitignore 대상).
#
# 2026-09-04: election_types 에 national_assembly 추가. party_lineage.yaml 에 송파갑
# 총선 후보 17건 매핑을 채웠다 (18~22대). 입력 149 → 산출 18건(대선 9 + 총선 9),
# 격리 0, 멱등(교체 18·신규 0). 총선 9건은 상위 기준선 레코드가 없어 confidence 0.7,
# gap_sigungu/sido/nation 전부 None. 총선 trend 분포: 진보이동 5 / 보수이동 3 / 정체 1.
verified: true

config:
  # --district 없이 실행하면 default_district 를 쓴다. trend_threshold 처럼 지역
  # 특화가 필요한 값이 생기면 districts.<id> 에 두어 common 을 덮어쓴다.
  default_district: seoul_songpa_gap
  districts:
    seoul_jongno: {}
    seoul_jung_seongdong_gap: {}
    seoul_jung_seongdong_eul: {}
    seoul_yongsan: {}
    seoul_gwangjin_gap: {}
    seoul_gwangjin_eul: {}
    seoul_dongdaemun_gap: {}
    seoul_dongdaemun_eul: {}
    seoul_jungnang_gap: {}
    seoul_jungnang_eul: {}
    seoul_seongbuk_gap: {}
    seoul_seongbuk_eul: {}
    seoul_gangbuk_gap: {}
    seoul_gangbuk_eul: {}
    seoul_dobong_gap: {}
    seoul_dobong_eul: {}
    seoul_nowon_gap: {}
    seoul_nowon_eul: {}
    seoul_eunpyeong_gap: {}
    seoul_eunpyeong_eul: {}
    seoul_seodaemun_gap: {}
    seoul_seodaemun_eul: {}
    seoul_mapo_gap: {}
    seoul_mapo_eul: {}
    seoul_yangcheon_gap: {}
    seoul_yangcheon_eul: {}
    seoul_gangseo_gap: {}
    seoul_gangseo_eul: {}
    seoul_gangseo_byeong: {}
    seoul_guro_gap: {}
    seoul_guro_eul: {}
    seoul_geumcheon: {}
    seoul_yeongdeungpo_gap: {}
    seoul_yeongdeungpo_eul: {}
    seoul_dongjak_gap: {}
    seoul_dongjak_eul: {}
    seoul_gwanak_gap: {}
    seoul_gwanak_eul: {}
    seoul_seocho_gap: {}
    seoul_seocho_eul: {}
    seoul_gangnam_gap: {}
    seoul_gangnam_eul: {}
    seoul_gangnam_byeong: {}
    seoul_songpa_gap: {}
    seoul_songpa_eul: {}
    seoul_songpa_byeong: {}
    seoul_gangdong_gap: {}
    seoul_gangdong_eul: {}
  # 산출할 선거 계열. 계열마다 (동 × 계열) 레코드 1건 — 한 시계열에 섞지 않는다.
  # 대선은 전국이 같은 선택지를 놓고 투표하므로 동별 편차가 곧 그 동네의 진영 성향이다.
  # 총선은 현역 프리미엄·후보 개인기·선거구 획정이 섞여 편차의 의미가 대선과 다르다
  # (A-001 §제약). 그래서 같은 축이 아니라 **별 레코드**로 나열한다. 총선은 상위 단위
  # 기준선 레코드가 아직 없어 gap_sigungu/sido/nation 이 전부 None, confidence 0.7.
  election_types: [presidential, national_assembly]

  # trend 판정 임계 (%p/회). **편차 기울기**에 적용된다 — 절대 득표율 기울기가 아니다.
  #
  # 왜 0.3 인가: 최근 3회가 2017(탄핵 직후 보수 저점) → 2022 → 2025 라
  # 절대 기울기로는 9개 동이 전부 conservative_shift 로 나온다(변별력 0).
  # 지역구 평균을 빼면 전국 공통 흐름이 상쇄되는 대신 스케일이 작아지므로
  # 임계도 함께 내려야 한다. ±1.0 을 쓰면 전부 stable 이 된다.
  # 이 값에서 3(보수이동) / 2(안정) / 4(진보이동) 로 갈린다.
  trend_threshold: 0.3

  # trend 를 계산할 최근 회차 수. 8회 전부를 쓰면 33년 전 구도가 섞인다.
  trend_window: 3
