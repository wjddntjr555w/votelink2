id: nec_archive_assembly
name: 중앙선관위 개표자료 아카이브 — 국회의원선거 지역구 (2008~2024)
kinds: [election_result]
source_name: 중앙선거관리위원회
source_url: https://info.nec.go.kr
source_license: public_open
access: file                 # 네트워크를 타지 않는다. Excel 을 디코딩만 한다
schedule: null                # 선거는 비정기. 새 총선이 치러졌을 때만 수동 실행
incremental: false            # 과거 선거는 값이 바뀌지 않는다. 재실행해도 멱등
geo_level: emd
requires_secrets: []
rate_limit_rps: 1
proposal: docs/proposals/C-005-nec-archive-assembly.md

# 2026-09-03: 5회 전부 실제 아카이브 파일로 검증. 송파갑 9동 × 5선거 = 45레코드,
# 격리 0. 산술 불변식(득표합=계, 계+무효=투표, 투표<=선거인) 전부 통과.
# 1위 후보·투표율이 실제 결과와 일치(교차확인): 2008 박영아(42.3%) · 2012 박인숙(57.1%)
# · 2016 박인숙(60.2%) · 2020 김웅(70.5%) · 2024 박정훈(69.9%).
#
# 2026-09-05 (D-002): 22대(2024)만 47개 선거구로 확장. 22대 전국 단일 파일은
# districts.yaml 의 출처 그 자체다(docs/SETUP.md §3) — 그래서 district_match
# 를 코드가 그 선거구의 districts.yaml name 에서 그대로 유도한다("{auto}" 마커,
# collector.py::_auto_district_match).
#
# 2026-09-05 (D-004): 19~21대도 마저 47개 선거구로 확장(18대는 제외 — 아래 참조).
# 이 회차들은 선거구별 파일이지만, 파일명·시트명이 22대와 **같은 표기 규칙**을
# 쓴다는 게 실측으로 확인됐다("강남구갑" 이 파일명·시트명·district_col 값
# 어디서나 똑같다) — 그래서 selector.file/sheet 도 "{auto}" 로 템플릿화했다
# (collector.py::_resolve).
#
# **18대(2008)는 자동 확장에서 뺐다.** 파일명은 대부분 일치하지만 그 시절
# 행정동 자체가 지금과 다른 경우가 흔하다 — 예: 관악구는 2008년에 '봉천제1동'
# ~'봉천제11동'·'신림제5동' 이었고 지금 이름(신사동·조원동 등)으로 남은 동이
# 하나도 없다(추정 불가능한 개명, C-005 §역사적 선거구 획정). 실측해 보니
# 정도만 다를 뿐 여러 자치구에서 비슷한 결측이 나왔다 — 개별 검증 없이 넓히면
# "일부 동만 있는 회차"를 "완전한 회차"인 척 내놓는 꼴이라 통째로 뺐다. 송파갑은
# 이미 개별 검증(득표율 교차확인)했으므로 그대로 유지한다.
#
# 19~21대도 자치구 세 종류는 파일명은 일치해도 **선거구 획정 자체**가 달라
# 실제로 돌려서 다시 뺐다(동 개수가 today's districts.yaml 과 안 맞음):
# 노원구 갑/을(당시 병까지 3분할이었다가 22대에 병이 없어지며 동이 재배분),
# 강동구 갑/을, 강남구 을. 구로구 갑·은평구 갑·송파구 병은 그 중 일부 회차만
# 안 맞아 해당 회차만 뺐다. 아래 districts.<id> 오버라이드에 그대로 반영했다.
#
# 나머지 3종(중구성동구 갑/을, 강남구병·강서구병)은 D-002 코멘트 그대로:
# 중구성동구 갑/을은 2008~2020 엔 이 결합 형태 자체가 없었다(그때는 중구 단독 +
# 성동구 갑/을). 강남구병·강서구병은 3분할이 20대(2016)부터 생겼다.
verified: true

config:
  archive_dir: "data/raw/nec_archive/02_국회의원선거(총선,재보궐선거)"

  # 회차별 지역구 선택 방법과 격자 배치. 7종 파일 구조 중 5개(18~22대)만 다룬다.
  # 16·17대는 후보명이 투표구 텍스트에 섞여 있어(`풍납제1동제1투`) 다른 추출
  # 방식이 필요하다 — C-005 §제약과 위험, 별도 작업으로 미룬다.
  #
  #   selector.file/sheet : fetch 가 읽을 위치. "{auto}" 는 그 선거구의
  #                          districts.yaml name 에서 유도한 표기로 치환된다
  #                          (예: "서울 강남구 갑" -> "강남구갑", collector.py::_resolve).
  #                          18~21대는 파일명·시트명에, 22대는 district_col 값에 쓰인다.
  #   district_match       : 파일 안에서 이 지역구를 찾을 때 대조할 원문 텍스트.
  #   district_name        : payload.district_name 에 쓰는 표시용 값. "{auto}" 규칙 같음
  #   layout.district_col  : 있으면(22대) grid 전체가 전국이라 이 열로 걸러낸다
  #
  # 아래 앵커(&election_NN)는 밑의 districts.<id> 가 회차를 줄여 쓸 때 참조한다
  # (YAML 특성상 참조보다 먼저 나와야 한다 — 그래서 elections 를 districts 위에 둔다).
  # 18대(2008)는 여기 없다 — 자동 확장에서 뺐다(위 상태 주석 참조). 송파갑만
  # districts.seoul_songpa_gap.elections 에 자기 것을 그대로 얹어 갖고 있다.
  elections:
    - &election_19
      id: 2012-04-11-national_assembly
      name: 제19대 국회의원선거
      date: "2012-04-11"
      district_match: "{auto}"
      district_name: "{auto}"
      # 파일명 자체가 오타다('국희의원'). 출처의 실수를 고치지 않고 그대로 쓴다 —
      # 다음에 파일이 바뀔 때 우리가 "고친" 이름이 매칭을 깨뜨리지 않게.
      selector:
        file: "제19대 국회의원선거/제19대 국회의원선거(지역구)/01_서울/국희의원_서울_{auto}.xls"
      # '정당\n후보' 가 한 칸에 병합돼 있다(candidate_name_row_offset 불필요).
      layout: {emd: 1, precinct: 2, eligible: 3, votes: 4, candidate_from: 5,
               label_row: 4, data_from: 5}

    - &election_20
      id: 2016-04-13-national_assembly
      name: 제20대 국회의원선거
      date: "2016-04-13"
      district_match: "{auto}"
      district_name: "{auto}"
      selector:
        file: "제20대 국회의원선거/지역구/1서울/개표상황(투표구별)_{auto}.xlsx"
      layout: {emd: 0, precinct: 1, eligible: 2, votes: 3, candidate_from: 4,
               label_row: 4, data_from: 5}

    - &election_21
      id: 2020-04-15-national_assembly
      name: 제21대 국회의원선거
      date: "2020-04-15"
      district_match: "{auto}"
      district_name: "{auto}"
      selector:
        file: "제21대 국회의원선거/지역구/1서울/개표상황(투표구별)_{auto}.xlsx"
      layout: {emd: 0, precinct: 1, eligible: 2, votes: 3, candidate_from: 4,
               label_row: 4, data_from: 5}

    - &election_22
      id: 2024-04-10-national_assembly
      name: 제22대 국회의원선거
      date: "2024-04-10"
      district_match: "{auto}"
      district_name: "{auto}"
      selector:
        file: "제22대 국회의원선거/1. 개표단위별 개표결과(지역구) -전국.xlsx"
      # 전국 단일 파일. district_col(선거구명, 1열)로 걸러낸다. '계' 위치는
      # 파일 전체가 공유하는 고정 헤더 행(3) — 최대 후보 수(50)에 맞춘 폭이라
      # 지역구마다 다르지 않다. 실제 후보 이름은 그 지역구 블록의 첫 행에만
      # 있으므로 candidate_from_block_start 로 알린다.
      layout: {emd: 3, precinct: 4, eligible: 5, votes: 6, candidate_from: 7,
               label_row: 3, data_from: 4, district_col: 1,
               candidate_from_block_start: true}

  # --district 없이 실행하면 default_district 를 쓴다. 송파갑은 처음 검증할 때
  # 그대로 손으로 적은 elections 를 유지한다(회귀 없음). 중구성동구 갑/을·
  # 강남구병·강서구병은 위 주석대로 회차를 줄인 elections 를 얹는다. 나머지
  # 44개 선거구는 `{}` 로 위 공용 elections(18~22대 전부, "{auto}" 템플릿)를
  # 그대로 쓴다.
  default_district: seoul_songpa_gap
  districts:
    seoul_songpa_gap:
      elections:
        - id: 2008-04-09-national_assembly
          name: 제18대 국회의원선거
          date: "2008-04-09"
          district_match: "송파구갑"
          district_name: "서울 송파구갑"
          selector:
            file: "제18대 국회의원선거/제18대 국회의원선거(지역구)/서울.xls"
            sheet: "송파구갑"
          layout: {emd: 0, precinct: 1, eligible: 2, votes: 3, candidate_from: 4,
                   label_row: 1, candidate_name_row_offset: 1, data_from: 3}

        - id: 2012-04-11-national_assembly
          name: 제19대 국회의원선거
          date: "2012-04-11"
          district_match: "송파구갑"
          district_name: "서울 송파구갑"
          selector:
            file: "제19대 국회의원선거/제19대 국회의원선거(지역구)/01_서울/국희의원_서울_송파구갑.xls"
          layout: {emd: 1, precinct: 2, eligible: 3, votes: 4, candidate_from: 5,
                   label_row: 4, data_from: 5}

        - id: 2016-04-13-national_assembly
          name: 제20대 국회의원선거
          date: "2016-04-13"
          district_match: "송파구갑"
          district_name: "서울 송파구갑"
          selector:
            file: "제20대 국회의원선거/지역구/1서울/개표상황(투표구별)_송파구갑.xlsx"
          layout: {emd: 0, precinct: 1, eligible: 2, votes: 3, candidate_from: 4,
                   label_row: 4, data_from: 5}

        - id: 2020-04-15-national_assembly
          name: 제21대 국회의원선거
          date: "2020-04-15"
          district_match: "송파구갑"
          district_name: "서울 송파구갑"
          selector:
            file: "제21대 국회의원선거/지역구/1서울/개표상황(투표구별)_송파구갑.xlsx"
          layout: {emd: 0, precinct: 1, eligible: 2, votes: 3, candidate_from: 4,
                   label_row: 4, data_from: 5}

        - id: 2024-04-10-national_assembly
          name: 제22대 국회의원선거
          date: "2024-04-10"
          district_match: "송파구갑"
          district_name: "서울 송파구갑"
          selector:
            file: "제22대 국회의원선거/1. 개표단위별 개표결과(지역구) -전국.xlsx"
          layout: {emd: 3, precinct: 4, eligible: 5, votes: 6, candidate_from: 7,
                   label_row: 3, data_from: 4, district_col: 1,
                   candidate_from_block_start: true}

    # 2008~2020 엔 '중구성동구' 결합 형태가 없었다(중구 단독 + 성동구 갑/을).
    # 지금 이 이름으로는 그 시절 파일을 못 찾는다 — 22대만 지원한다.
    seoul_jung_seongdong_gap: { elections: [*election_22] }
    seoul_jung_seongdong_eul: { elections: [*election_22] }

    # 3분할(병)은 20대(2016)부터 생겼다 — 18·19대는 갑/을 2개뿐이었다.
    seoul_gangnam_byeong: { elections: [*election_20, *election_21, *election_22] }
    seoul_gangseo_byeong: { elections: [*election_20, *election_21, *election_22] }

    # 아래 다섯은 파일명은 맞는데(19~21대) 실제로 돌려보니 동 개수가 today's
    # districts.yaml 과 안 맞았다 — 노원구는 당시 병까지 3분할이었다가 22대에
    # 병이 없어지며 동이 재배분됐고, 강동구 갑/을·강남구 을도 같은 이유로 보인다.
    # 안 맞는 회차는 빼고 22대만 남긴다(추정 금지).
    seoul_nowon_gap: { elections: [*election_22] }
    seoul_nowon_eul: { elections: [*election_22] }
    seoul_gangdong_gap: { elections: [*election_22] }
    seoul_gangdong_eul: { elections: [*election_22] }
    seoul_gangnam_eul: { elections: [*election_22] }

    # 구로구 갑: 19·20대만 동 하나가 안 맞는다(21대부터 맞음).
    seoul_guro_gap: { elections: [*election_21, *election_22] }
    # 은평구 갑: 19대만 동 하나가 안 맞는다(20대부터 맞음).
    seoul_eunpyeong_gap: { elections: [*election_20, *election_21, *election_22] }
    # 송파구 병: 19대만 동 하나가 안 맞는다(20대부터 맞음).
    seoul_songpa_byeong: { elections: [*election_20, *election_21, *election_22] }

    seoul_jongno: {}
    seoul_yongsan: {}
    seoul_gwangjin_gap: {}
    seoul_gwangjin_eul: {}
    seoul_dongdaemun_gap: {}
    seoul_dongdaemun_eul: {}
    seoul_jungnang_gap: {}
    seoul_jungnang_eul: {}
    seoul_seongbuk_gap: {}
    seoul_seongbuk_eul: {}
    seoul_gangbuk_gap: {}
    seoul_gangbuk_eul: {}
    seoul_dobong_gap: {}
    seoul_dobong_eul: {}
    seoul_eunpyeong_eul: {}
    seoul_seodaemun_gap: {}
    seoul_seodaemun_eul: {}
    seoul_mapo_gap: {}
    seoul_mapo_eul: {}
    seoul_yangcheon_gap: {}
    seoul_yangcheon_eul: {}
    seoul_gangseo_gap: {}
    seoul_gangseo_eul: {}
    seoul_guro_eul: {}
    seoul_geumcheon: {}
    seoul_yeongdeungpo_gap: {}
    seoul_yeongdeungpo_eul: {}
    seoul_dongjak_gap: {}
    seoul_dongjak_eul: {}
    seoul_gwanak_gap: {}
    seoul_gwanak_eul: {}
    seoul_seocho_gap: {}
    seoul_seocho_eul: {}
    seoul_gangnam_gap: {}
    seoul_songpa_eul: {}
