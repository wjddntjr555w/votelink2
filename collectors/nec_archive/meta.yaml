id: nec_archive
name: 중앙선관위 개표자료 아카이브 — 대통령선거 (1992~2025)
kinds: [election_result]
source_name: 중앙선거관리위원회
source_url: https://info.nec.go.kr
source_license: public_open
access: file                 # 네트워크를 타지 않는다. Excel 을 디코딩만 한다
schedule: null               # 선거는 비정기. 새 대선이 치러졌을 때만 수동 실행
incremental: false           # 과거 선거는 값이 바뀌지 않는다. 재실행해도 멱등
geo_level: emd
requires_secrets: []
rate_limit_rps: 1            # 쓰이지 않는다 (네트워크 없음)
proposal: docs/proposals/C-004-nec-archive-presidential.md

# 2026-09-02: 대선 8회 전부 실측 검증. 송파갑 9동 × 8선거 = 72레코드,
# 중복 0, 격리 0, 산술 불변식(득표합=계, 계+무효=투표, 투표<=선거인) 전부 통과.
#
# 2026-09-03: 기준선(전국·서울시·송파구) 22레코드 추가 → 총 94. 재수집 없이
# --reparse 로 만들었다(원본 격자에 전국이 이미 들어 있었고 파서가 버리고 있었다).
# 투표율이 실제 공식 집계와 일치한다: 2002 70.8% · 2012 75.8% · 2017 77.2% ·
# 2022 77.1% · 2025 79.4%.
#
# 2026-09-03 이어서: 17대(2007) 전국 1건 추가 → 총 95. 서울 파일 하나로는 전국을
# 못 만들어 나머지 15개 시도 파일을 fetch 해 각 파일 자체 총계(구 합계의 합)를
# 서울 몫과 합산했다. 전국 투표율 63.0%가 17대 실제 결과와 일치. 옛(region_grids
# 없는) raw 배치는 이 필드를 낼 수 없어 건너뛰고, 새 배치가 채운다 — data/raw/ 는
# 절대 수정·삭제하지 않으므로 --reparse 가 둘 다 읽고도 멱등을 유지한다(검증함).
#
# 결측 1건은 정직하게 비워 둔다 — 2002년은 시도 열이 없어 서울시를 만들 수 없다.
# confidence 는 그래서 8회 전부 0.7 (voter_profile 이 4단계 완비를 요구한다).
#
# 2026-09-07 (D-006): sigungu 기준선 geo_code 를 District.primary_sigungu_code
# (admmCd 앞 5자리)로 통일했다 — 앞 4자리로 자르던 옛 로직은 광진(11215)·강북
# (11305)·금천(11545)에서 존재하지 않는 절단 코드를 냈다(그동안 voter_profile 이
# geo_code 를 안 보고 있어 드러나지 않았다). --all-districts --reparse 로 재생성:
# 48/48 선거구, 격리 0, 저장 4125 그대로, sigungu 코드 25개 전부 실제 자치구와
# 일치. 송파구(11710)는 두 규칙이 같아 값 불변(회귀 없음).
verified: true

config:
  archive_dir: "data/raw/nec_archive/01_대통령선거(대선)"

  # 동 단위 합계 행의 투표구명. 선거마다 다르다 —
  # 16·17대 '소계', 19대 '합계', 18·20·21대 빈칸. 14·15대는 투표구 열 자체가 없다.
  precinct_total_markers: ["", "소계", "합계"]

  # --district 없이 실행하면 default_district 를 쓴다. 대상 자치구(sigungu_match)와
  # 기준선 지리(baseline_geo)는 이제 여기 적지 않는다 — collector.py 가
  # districts.yaml 에서 그때그때 유도한다(D-002, `_sigungu_match`/`_baseline_geo`).
  # 그래서 districts 는 '이 선거구를 쓸 수 있다'는 등록 표시일 뿐이다.
  default_district: seoul_songpa_gap
  districts:
    seoul_songpa_gap: {}
    seoul_jongno: {}
    seoul_jung_seongdong_gap: {}
    seoul_jung_seongdong_eul:
      # 중구 15동 + 성동구 4동(금호1~4가동·옥수동)이 섞인 선거구다(D-001·D-002).
      # district.sigungu(중구) 하나만으로 걸러내면 성동구 4동을 놓친다.
      extra_sigungu: ["성동"]
    seoul_yongsan: {}
    seoul_gwangjin_gap: {}
    seoul_gwangjin_eul: {}
    seoul_dongdaemun_gap: {}
    seoul_dongdaemun_eul: {}
    seoul_jungnang_gap: {}
    seoul_jungnang_eul: {}
    seoul_seongbuk_gap: {}
    seoul_seongbuk_eul: {}
    seoul_gangbuk_gap: {}
    seoul_gangbuk_eul: {}
    seoul_dobong_gap: {}
    seoul_dobong_eul: {}
    seoul_nowon_gap: {}
    seoul_nowon_eul: {}
    seoul_eunpyeong_gap: {}
    seoul_eunpyeong_eul: {}
    seoul_seodaemun_gap: {}
    seoul_seodaemun_eul: {}
    seoul_mapo_gap: {}
    seoul_mapo_eul: {}
    seoul_yangcheon_gap: {}
    seoul_yangcheon_eul: {}
    seoul_gangseo_gap: {}
    seoul_gangseo_eul: {}
    seoul_gangseo_byeong: {}
    seoul_guro_gap: {}
    seoul_guro_eul: {}
    seoul_geumcheon: {}
    seoul_yeongdeungpo_gap: {}
    seoul_yeongdeungpo_eul: {}
    seoul_dongjak_gap: {}
    seoul_dongjak_eul: {}
    seoul_gwanak_gap: {}
    seoul_gwanak_eul: {}
    seoul_seocho_gap: {}
    seoul_seocho_eul: {}
    seoul_gangnam_gap: {}
    seoul_gangnam_eul: {}
    seoul_gangnam_byeong: {}
    seoul_songpa_eul: {}
    seoul_songpa_byeong: {}
    seoul_gangdong_gap: {}
    seoul_gangdong_eul: {}

  # 선거별 레이아웃. 33년치가 서로 다르므로 코드가 아니라 여기 데이터로 둔다.
  #   sgg/emd/eligible/votes/candidate_from/total/invalid : 열 인덱스 (0부터)
  #   total 은 출처의 '계'(후보 득표 합계) 열이며 후보 열의 끝 경계다
  #   party_row == candidate_row 이면 '정당\n후보' 가 한 칸에 들어 있다는 뜻
  elections:
    - id: 1992-12-18-presidential
      name: 제14대 대통령선거
      date: "1992-12-18"
      file: "제14대 대통령선거 개표자료.xls"
      layout: {sido: 0, sgg: 1, emd: 2, precinct: null, eligible: 3, votes: 5,
               candidate_from: 7, total: 15, invalid: 16,
               party_row: 2, candidate_row: 3, data_from: 4}
      # 송파구가 '송파구' 로 존재하지 않는다. 선거구 단위('송파구갑'·'송파구을')로만
      # 나오므로 접두사로 잡아 **합산**한다.
      baselines:
        - {level: nation,  sido: "전국", expect: 1}
        - {level: sido,    sido_prefix: "서울", sgg: "합계", expect: 1}
        - {level: sigungu, sgg_prefix: "{sigungu}", emd: ["소계"], expect: null}

    - id: 1997-12-18-presidential
      name: 제15대 대통령선거
      date: "1997-12-18"
      file: "제15대 대통령선거 개표자료.xls"
      layout: {sido: 0, sgg: 1, emd: 2, precinct: null, eligible: 3, votes: 5,
               candidate_from: 7, total: 14, invalid: 15,
               party_row: 2, candidate_row: 3, data_from: 4}
      # 1997년 송파구는 갑·을·병 3개 선거구다.
      baselines:
        - {level: nation,  sido: "전국", expect: 1}
        - {level: sido,    sido_prefix: "서울", sgg: "합계", expect: 1}
        - {level: sigungu, sgg_prefix: "{sigungu}", emd: ["소계"], expect: null}

    # 위원회명이 '[송파구]' 형태다. 대괄호는 파서가 벗긴다.
    - id: 2002-12-19-presidential
      name: 제16대 대통령선거
      date: "2002-12-19"
      file: "제16대 대통령선거 개표자료.xls"
      layout: {sgg: 0, emd: 1, precinct: 2, eligible: 3, votes: 4,
               candidate_from: 5, total: 11, invalid: 12,
               party_row: null, candidate_row: 0, data_from: 1}
      # **시도 열이 없다.** 그래서 서울시 기준선을 만들 수 없다 — 어느 구가 서울인지
      # 파일만 봐서는 알 수 없고, 구 이름 목록을 코드에 박는 것은 이 프로젝트의
      # 규칙에 어긋난다. 전국은 모든 구의 합계 행을 더해서 만든다.
      baselines:
        # 244 = 이 파일에 든 시군구 위원회 수. 합산 결과가 실제 전국 집계와
        # 일치하는 것으로 확인했다 (선거인수 34,991,529 · 투표율 70.8%).
        - {level: nation,  emd: ["합계"], expect: 244}
        - {level: sigungu, sgg: "{sigungu}", emd: ["합계"], expect: null}

    # 시도별 16개 파일로 쪼개져 있다. 서울 파일만 쓴다.
    - id: 2007-12-19-presidential
      name: 제17대 대통령선거
      date: "2007-12-19"
      file: "제17대 대통령선거 개표자료/01_17대선_투표구별개표자료_서울.xls"
      layout: {sgg: 0, emd: 1, precinct: 2, eligible: 3, votes: 5,
               candidate_from: 6, total: 16, invalid: 17,
               party_row: 1, candidate_row: 2, data_from: 3}
      # 서울 파일만으로는 전국을 만들 수 없다. 나머지 15개 시도 파일을 함께 읽어
      # 각 파일 자체의 총계(그 안의 구 합계를 전부 더한 값)를 구하고, 서울 몫
      # (아래 sido 기준선과 같은 값)과 합산해 전국을 만든다. 구 개수는 실측(2026-09-03,
      # 해당 파일의 emd='합계' 행을 세어 확인) — 투표율 63.0%가 17대 실제 결과와 일치했다.
      extra_files:
        - {name: 부산, file: "제17대 대통령선거 개표자료/02_17대선_투표구별개표자료_부산.xls", expect: 16}
        - {name: 대구, file: "제17대 대통령선거 개표자료/03_17대선_투표구별개표자료_대구.xls", expect: 8}
        - {name: 인천, file: "제17대 대통령선거 개표자료/04_17대선_투표구별개표자료_인천.xls", expect: 10}
        - {name: 광주, file: "제17대 대통령선거 개표자료/05_17대선_투표구별개표자료_광주.xls", expect: 5}
        - {name: 대전, file: "제17대 대통령선거 개표자료/06_17대선_투표구별개표자료_대전.xls", expect: 5}
        - {name: 울산, file: "제17대 대통령선거 개표자료/07_17대선_투표구별개표자료_울산.xls", expect: 5}
        - {name: 경기, file: "제17대 대통령선거 개표자료/08_17대선_투표구별개표자료_경기.xls", expect: 44}
        - {name: 강원, file: "제17대 대통령선거 개표자료/09_17대선_투표구별개표자료_강원.xls", expect: 18}
        - {name: 충북, file: "제17대 대통령선거 개표자료/10_17대선_투표구별개표자료_충북.xls", expect: 13}
        - {name: 충남, file: "제17대 대통령선거 개표자료/11_17대선_투표구별개표자료_충남.xls", expect: 16}
        - {name: 전북, file: "제17대 대통령선거 개표자료/12_17대선_투표구별개표자료_전북.xls", expect: 15}
        - {name: 전남, file: "제17대 대통령선거 개표자료/13_17대선_투표구별개표자료_전남.xls", expect: 22}
        - {name: 경북, file: "제17대 대통령선거 개표자료/14_17대선_투표구별개표자료_경북.xls", expect: 24}
        - {name: 경남, file: "제17대 대통령선거 개표자료/15_17대선_투표구별개표자료_경남.xls", expect: 20}
        - {name: 제주, file: "제17대 대통령선거 개표자료/16_17대선_투표구별개표자료_제주.xls", expect: 2}
      # 서울 파일 전체가 서울시 기준선이다. 구 합계를 더하면 서울, 위 15개와
      # 합산하면 전국 (parse() 가 처리한다). 송파구는 서울 파일 안의 구 하나.
      baselines:
        - {level: sido,    emd: ["합계"], expect: 25}
        - {level: sigungu, sgg: "{sigungu}", emd: ["합계"], expect: null}

    # A열이 통째로 비어 있어 모든 열이 1씩 밀려 있다.
    - id: 2012-12-19-presidential
      name: 제18대 대통령선거
      date: "2012-12-19"
      file: "제18대 대통령선거 개표자료.xls"
      layout: {sido: 1, sgg: 2, emd: 3, precinct: 4, eligible: 5, votes: 6,
               candidate_from: 7, total: 13, invalid: 14,
               party_row: 4, candidate_row: 4, data_from: 5}
      # **송파구에 '소계' 행이 둘이다.** 첫 행이 구 전체(545,369), 뒤 행은 재외·부재자를
      # 뺀 관내분(527,457)이다. 둘 다 산술이 맞아서 합치면 득표가 정확히 두 배가
      # 되는데도 불변식에 걸리지 않고 투표율까지 그럴듯하게 나온다. expect 로 잡는다.
      baselines:
        - {level: nation,  sido: "전국", expect: 1}
        - {level: sido,    sido_prefix: "서울", sgg: "합계", expect: 1}
        - {level: sigungu, sgg: "{sigungu}", emd: ["소계"], expect: null, take_first: true}

    # 동 단위 행의 투표구명이 '합계'다 (다른 선거는 빈칸이나 '소계').
    - id: 2017-05-09-presidential
      name: 제19대 대통령선거
      date: "2017-05-09"
      file: "제19대 대통령선거 개표자료.xlsx"
      layout: {sido: 0, sgg: 1, emd: 2, precinct: 3, eligible: 4, votes: 5,
               candidate_from: 6, total: 19, invalid: 20,
               party_row: 1, candidate_row: 1, data_from: 2}
      # 이 회차만 전국 총계 행의 시군구 칸이 비어 있다(sgg 조건을 걸 수 없다).
      baselines:
        - {level: nation,  sido: "전국", expect: 1}
        - {level: sido,    sido_prefix: "서울", sgg: "합계", expect: 1}
        - {level: sigungu, sgg: "{sigungu}", emd: ["합계"], expect: null}

    - id: 2022-03-09-presidential
      name: 제20대 대통령선거
      date: "2022-03-09"
      file: "제20대 대통령선거 개표결과.xlsx"
      layout: {sido: 0, sgg: 1, emd: 2, precinct: 3, eligible: 4, votes: 5,
               candidate_from: 6, total: 18, invalid: 19,
               party_row: 0, candidate_row: 0, data_from: 1}
      # 서울 총계 행의 표기가 '합계(특별시)' 다. 접두사로 잡는다.
      baselines:
        - {level: nation,  sido: "전국", sgg: "합계", expect: 1}
        - {level: sido,    sido_prefix: "서울", sgg_prefix: "합계", expect: 1}
        - {level: sigungu, sgg: "{sigungu}", emd: ["합계"], expect: null}

    - id: 2025-06-03-presidential
      name: 제21대 대통령선거
      date: "2025-06-03"
      file: "제21대 대통령선거 개표결과.xlsx"
      layout: {sido: 0, sgg: 1, emd: 2, precinct: 3, eligible: 4, votes: 5,
               candidate_from: 6, total: 11, invalid: 12,
               party_row: 4, candidate_row: 4, data_from: 6}
      baselines:
        - {level: nation,  sido: "전국", sgg: "합계", expect: 1}
        - {level: sido,    sido_prefix: "서울", sgg_prefix: "합계", expect: 1}
        - {level: sigungu, sgg: "{sigungu}", emd: ["합계"], expect: null}
