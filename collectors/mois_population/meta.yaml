id: mois_population
name: 행정안전부 주민등록 인구 (행정동 × 연령 × 성별)
kinds: [population]
source_name: 행정안전부
source_url: https://www.data.go.kr/data/15108072/openapi.do
source_license: public_open
access: api
schedule: "0 5 5 * *"      # 매월 5일 05:00. 원 데이터는 매월 말일 기준으로 갱신된다
incremental: false          # 월 단위 스냅샷. 증분 개념이 없다
geo_level: emd
requires_secrets: [DATA_GO_KR_SERVICE_KEY]
rate_limit_rps: 2
proposal: docs/proposals/C-001-mois-population.md

# 실제 응답으로 아직 검증되지 않았다. 첫 실행 전에 아래 절차를 따를 것:
#   1) config.endpoint 를 포털에서 복사한 실제 URL로 교체
#   2) uv run votelink collect mois_population --capture-fixture
#   3) uv run pytest collectors/mois_population/
#   4) 통과하면 verified: true 로 바꾼다
verified: false

config:
  # 공공데이터포털 데이터셋의 요청 URL (인증키 제외)
  endpoint: "https://apis.data.go.kr/1741000/admmSexdAgePpltn"

  # 이 스냅샷의 기준월. 데이터셋을 갱신하면 함께 바꾼다.
  reference_month: "2026-07"

  # --- 아래는 실제 API 명세로 아직 확인되지 않았다. 응답이 이상하면 여기부터 고친다 ---

  # 매 요청에 붙는 고정 파라미터 (응답 포맷 지정 등)
  params:
    type: JSON

  paging:
    page_param: pageNo
    size_param: numOfRows
    size: 1000
    max_pages: 100

  # 조회할 행정동 기관코드. 비우면 코드 지정 없이 전체를 페이징한다.
  admm_code_param: admmCd
  admm_codes:
    - "3230040"   # 서울 송파구 풍납1동

  # 응답에서 목록을 꺼낼 경로 (예: "response.body.items.item").
  # 비워두면 알려진 형태를 자동 탐색하고, 찾으면 경로를 로그로 알려준다.
  data_path: ""
