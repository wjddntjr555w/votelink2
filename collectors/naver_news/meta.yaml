id: naver_news
name: 네이버 뉴스 검색 (송파구 지역 기사 메타)
kinds: [news_article]
source_name: 네이버
source_url: https://www.ncloud.com/product/applicationService/naverApiHub
source_license: api_tos      # public_open 이 아니다 — 계약이 원문 전문 저장을 거부한다
access: api
schedule: "0 6 * * *"        # 매일 06:00 KST
incremental: true            # 단, 서버 필터가 아니라 sort=date + 클라이언트 컷오프다
geo_level: sigungu
requires_secrets: [NAVER_CLIENT_ID, NAVER_CLIENT_SECRET]
rate_limit_rps: 2
proposal: docs/proposals/C-003-naver-news.md

# 2026-09-06: NAVER API HUB 키로 실제 응답 검증 완료.
#   - 엔드포인트 /search/v1/news 가 맞았다(2차 출처였는데 정확했다).
#   - HUB 응답이 레거시와 **완전히 동일**하다: 봉투(lastBuildDate/total/start/
#     display/items), 필드명(title/originallink/link/description/pubDate),
#     pubDate 포맷(RFC 1123) 전부. F_* 상수·parse 로직 그대로 통과.
#   - 첫 수집(since=None, 검색어 9개 × 최대 10페이지): 배치 90 · 유효 8229 ·
#     격리 0 (0.0%). confidence 0.9(동/지명 직접) 3819 / 0.7(구 단위만) 4410.
#     geo_level 전부 sigungu, geo_code 1171000000, 전문 저장 0.
#   - 스포츠·연예 기사가 섞인다('송파'=잠실운동장·올림픽공원 지명 매칭). 계약
#     위반이 아니라 대상 판별이 L2(issue_ranker/local_issue)의 일이다(제안서).
verified: true

config:
  # 2026년 네이버가 검색 API 를 NAVER API HUB(네이버클라우드플랫폼)로 이관했다.
  #   2026-06-25  HUB 정식 오픈
  #   2026-07-31  구 developers.naver.com 신규 등록 종료
  #   2027-06-30  구 인증정보(X-Naver-*) 지원 종료
  # 베이스 URL(https://naverapihub.apigw.ntruss.com), 헤더 이름, 뒤쪽 경로
  # (/search/v1/news) 전부 2026-09-06 실제 호출로 확인했다(HTTP 200).
  endpoint: "https://naverapihub.apigw.ntruss.com/search/v1/news"

  auth:
    header_id: X-NCP-APIGW-API-KEY-ID
    header_secret: X-NCP-APIGW-API-KEY
    # 2027-06-30 이전에 발급받은 레거시 키를 쓴다면 이 두 줄로 바꾼다:
    #   header_id: X-Naver-Client-Id
    #   header_secret: X-Naver-Client-Secret
    # 그리고 endpoint 를 https://openapi.naver.com/v1/search/news.json 로 되돌린다.

  sort: date                 # sim(정확도) 이 기본값이다. 증분 컷오프에는 date 여야 한다

  paging:
    display: 100             # 한 페이지 최대
    max_start: 1000          # API 상한. 검색어당 1,000건까지만 페이징된다 (백필 불가)

  # 도메인 -> 언론사명. 비어 있으면 호스트를 그대로 publisher 로 쓴다.
  publisher_names: {}

  # --district 없이 실행하면 default_district 를 쓴다. 지리 앵커·검색어·매칭 표현은
  # 선거구마다 다르므로 districts.<id> 에 둔다. 기사는 행정동에 귀속시키지 않는다
  # (제안서 "공통 레코드로의 매핑" 참조).
  default_district: seoul_songpa_gap
  districts:
    seoul_songpa_gap:
      # 이 코드는 mois_population 이 lv=3 조회에 실제로 써서 산하 동을 받아온 값이다.
      sigungu_code: "1171000000"
      geo_name: 서울 송파구

      # 검색어. id 는 raw 파일명이 되므로 ascii 여야 한다 (한글은 slugify 에서 사라진다).
      queries:
        - { id: songpa-gu,     q: "송파구" }
        - { id: songpa-gap,    q: "송파갑" }
        - { id: jamsil,        q: "잠실" }
        - { id: olympic-park,  q: "올림픽공원" }
        - { id: garak-market,  q: "가락시장" }
        - { id: pungnap,       q: "풍납동" }
        - { id: bangi,         q: "방이동" }
        - { id: oryun,         q: "오륜동" }
        - { id: seokchon-lake, q: "석촌호수" }

      # 지역구를 특정하는 표현 → confidence 0.9.
      # districts.yaml 의 행정동명(풍납1동 등)은 코드가 자동으로 합친다.
      # 뉴스는 보통 법정동·통칭으로 쓰므로 여기에 그 표기를 둔다.
      district_terms:
        - 풍납동
        - 방이동
        - 오륜동
        - 몽촌토성
        - 올림픽공원
        - 한성백제박물관

      # 구 단위 표현 → confidence 0.7. 이 중 하나도 안 걸리면 기사를 버린다.
      sigungu_terms:
        - 송파구
        - 송파
        - 잠실
        - 가락시장
        - 석촌호수
        - 송파구청

      # 공인 화이트리스트(현역 의원·출마 예정자 등)만 문자열 매칭한다.
      # 일반인 이름은 넣지 않는다 — 절대규칙 3(개인 식별 정보 수집 금지).
      person_terms: []

    # --- 서울 나머지 24개 자치구 (C-006). 집계 단위는 자치구다: 같은 자치구의
    # 갑/을/병 선거구는 같은 뉴스를 본다. 블록 키는 그 자치구의 대표 선거구 id.
    # sigungu_code 는 collectors/mois_population/meta.yaml 에서 그대로 가져왔다.
    # queries[].id 는 raw 파일명이 되므로 ascii. 행정동명(예 "역삼1동")은
    # districts.yaml 에서 자동 병합되므로 district_terms 에는 법정동·통칭만 둔다.
    seoul_jongno:
      sigungu_code: "1111000000"
      geo_name: 서울 종로구
      queries:
        - { id: jongno-gu, q: "종로구" }
        - { id: jongno-mp, q: "종로 국회의원" }
        - { id: gwanghwamun, q: "광화문" }
        - { id: hyehwa, q: "혜화동" }
        - { id: buam, q: "부암동" }
        - { id: pyeongchang, q: "평창동" }
        - { id: changsin, q: "창신동" }
      sigungu_terms: [종로구, 종로]
      district_terms: [광화문, 혜화동, 부암동, 평창동, 창신동, 숭인동, 인사동, 대학로]
      person_terms: []

    seoul_jung_seongdong_eul:
      # 중구성동구 을은 중구 15동 + 성동구 4동이 섞인 걸침 선거구다. naver_news 는
      # sigungu_code 하나만 받으므로 여기는 중구로 두고, 성동구 뉴스는
      # seoul_jung_seongdong_gap 블록이 담당한다. 웹은 두 시군구 프리픽스를 다 읽는다.
