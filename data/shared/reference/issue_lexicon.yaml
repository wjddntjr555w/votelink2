# 이슈 카테고리 ↔ 키워드. **지역적·정치적 편집 판단이다.** party_lineage.yaml·districts.yaml 과
# 같은 원칙으로 코드에 박지 않고 파일로 노출한다 (docs/30-analysis-spec.md §8).
# 이견이 있으면 이 파일만 고치고 `uv run votelink analyze issue_ranker` 를 다시 돌린다.
#
# 매칭은 형태소 분석도 개체명 인식도 아니다 — 기사 title + summary 에 keyword 가
# substring 으로 등장하면 그 카테고리로 센다 (collectors/naver_news/text.py:match_terms 와
# 같은 방식). 한 기사가 여러 카테고리에 걸리면 전부 센다 (share 합 > 100 가능).
#
# **표본이 약하다.** naver_news 의 "송파" 검색분은 스포츠(잠실야구장)·행사(석촌호수
# 서울패션위크)·금융사 인사·부고가 70% 이상이고, 분류되는 기사에도 "송파를 스쳐
# 언급한 국가 뉴스"(선관위 특검, 강남 재건축 비교)가 섞인다. substring 매칭으로는
# 그 둘을 못 가른다. 그래서 키워드는 넓게 잡지 않고 **고유명·복합어 위주로 좁게**
# 잡는다 — 놓치는 편이 국가뉴스를 지역 현안으로 잘못 세우는 것보다 낫다.
# 스포츠·연예 포괄 카테고리는 두지 않는다. 그런 기사는 unclassified 로 떨어져야 하고,
# 그 비율이 크면(현재 ~80%) 더 나은 지역 뉴스 수집기가 필요하다는 신호다.
#
# 상태: **초안 (draft-2026-09-06)**. 사용자 검수 전이며 issue_ranker meta.verified 는
# false 다. version 은 payload.lexicon_version 에 박힌다.

