# 선거구 ↔ 행정동 매핑.
#
# 선거구 획정은 매 선거마다 바뀐다. 코드에 박지 않고 여기 데이터로 둔다.
# 수집기(어디를 수집할지)와 분석기(어디를 분석할지)가 이 파일 하나를 본다.
#
# code      : 내부 표준 = 행정동코드 10자리. mois_population 수집기가 실제 API
#             응답(admmCd)에서 확인한 값만 채운다. 확인 전에는 null.
#             (행안부 게시판의 법정동코드와는 다른 체계다 — 값이 다르다.
#             예: 풍납동 법정동코드 1171010300 ≠ 풍납1동 admmCd 1171051000)
# org_code  : 행정기관코드 7자리 (code.go.kr). 참고용이며 geo_code 로 쓰지 않는다.
#
# 이 파일은 '이름만 주고 코드를 안 주는' 출처의 geo_code 원천이다.
# nec_election_result(선거 개표결과)가 여기 code 를 그대로 가져다 쓴다 —
# 비어 있으면 그 동은 수집에서 격리된다.

version: "2026-09 기준"

districts:
  #
  # 아래 47개는 제22대 국회의원선거 개표결과(지역구) 전국 xlsx 에서 추출했다
  # (선거구명 x 읍면동명). code(admmCd) 는 아직 비어 있다 — 그 선거구로
  #   uv run votelink collect mois_population --district <id>
  # 를 돌리면 응답의 admmCd 로 채워진다. 채우기 전에는 수집에서 pending 으로
  # 빠지고 웹앱은 '분석 결과 없는 행정동' 으로 표시한다.
  #
  # 행정동명이 MOIS 응답과 다르면(예: '창신제1동' vs '창신1동') mois_population 이
  # 'missing target dong' 으로 크게 실패한다 — 그때 이 파일의 name 을 맞춘다.

