# 산출물 검증 **정책** — 공용. 규약은 `docs/90-compliance.md`.
#
# **여기에는 서명이 없다.** 이 파일이 말하는 것은 "이 산출물이 어떤 성질인가"뿐이다 —
# 위험도, 배포 범위, 기간 제한, 파생 여부. 그건 캠프와 무관하게 같다.
#
# "검토했는가"는 캠프마다 다르므로 캠프 공간으로 갔다:
#   data/camps/<캠프>/cycles/<주기>/compliance.review.yaml
# 거기에 status·reviewed_by·reviewed_at 이 있다 (P-001 §13, 2026-09-08 분리).
#
# 코드가 아니라 데이터로 두는 이유는 districts.yaml(획정이 바뀐다)·
# party_lineage.yaml(정치적 판단이다)과 같다 — 변호사가 파이썬을 읽지 않아도
# 검토하고 고칠 수 있어야 한다.
#
# 선거일도 여기 없다. 캠프의 election.yaml 에 있다 — 캠프마다 나가는 선거가 다르므로
# 공표 금지기간(§108) 판정도 캠프마다 다르다.

version: "2026-09 기준"

# 정책표에 아예 없는 kind 의 처분. **cleared 로 바꾸는 것은 규칙 5를 끄는 것이다.**
# 코드가 이 값을 검증해서 cleared 면 로딩 자체가 실패한다.
default_status: unreviewed

outputs:
  # 지금 실제로 레코드가 존재하는 산출물만 적는다.
  # 아직 없는 kind(poll, poi, foot_traffic, local_issue 등)를 미리 적지 않는 이유:
  # fail-closed 라서 적지 않아도 unreviewed 로 보호되고, 미리 적으면 집행되지 않는
  # 규칙이 파일에만 쌓인다 (docs/90-compliance.md §6 · §11).

  - kind: news_article
    risk: low
    derived: false
    distribution: internal_only
    ai_generated: false
    note: >-
      네이버 검색 API 가 준 기사 메타(제목·언론사·발행시각·링크·스니펫)뿐이다.
      본문 전문은 저장하지 않고(계약이 막는다) 화면은 원문 링크로만 연결한다.
      geo_level 은 sigungu 고정 — 기사를 행정동에 귀속시키지 않는다.
      여론조사를 인용한 기사가 섞일 수 있으므로, 공표 금지기간(선거일 6일 전~
      투표 마감)에 이 화면을 외부로 내보내면 위반 소지가 있다. election_day 가
      설정되면 그 판정을 붙인다.

  - kind: news_pulse
    risk: low
    derived: true
    distribution: internal_only
    ai_generated: false
    note: >-
      news_article(네이버 검색 API 메타)를 주 단위로 접은 파생 집계다. 기사 본문도
      개인 식별 정보도 없고 최소 단위는 시군구다. spike 는 급증 여부일 뿐 이슈
      분류가 아니다. 첫 백필은 API 상한 때문에 최근 주가 부풀어 있어
      backfill_distorted=true 로 표시되며, 그 상태의 급증 판정은 신뢰 대상이 아니다.
      이 화면을 외부로 내보내면 사전선거운동 기간 판정 대상이 된다.

  - kind: local_issue
    risk: low
    derived: true
    distribution: internal_only
    ai_generated: false
    note: >-
      news_article(네이버 검색 API 메타)를 어휘집(issue_lexicon.yaml)으로 분류해 언급
      빈도·최근성으로 세운 파생 랭킹이다. LLM 을 쓰지 않는다 — 순수 substring 매칭이라
      재현 가능하다. 기사 본문도 개인 식별 정보도 없고 최소 단위는 시군구다.
      sample_headlines 는 이미 news_article 에 저장된 원문 제목 최대 3개이며 본문은
      없다. 감성·유불리는 판정하지 않는다. 어휘집이 곧 편집 판단이므로 lexicon_version
      을 payload 에 박아 재현 가능하게 했다. 이 화면을 외부로 내보내면 사전선거운동
      기간 판정 대상이 된다.

  - kind: segment_profile
    risk: low
    derived: true
    distribution: internal_only
    ai_generated: false

    # 신뢰도 하한. 미달이면 상태는 그대로 두고 화면에 경고 문구만 덧붙인다 —
    # 검토를 통과한 것과 데이터가 튼튼한 것은 다른 문제다.
    # 현재 voter_profile 은 0.7 이다(기준선 2건 결측: 2002 서울시·2007 전국).
    min_confidence: 0.5

    # 검토 여부는 여기 없다 — 캠프의 compliance.review.yaml 이 말한다.
    # 아직 아무 캠프도 검토하지 않았으므로 대시보드에 경고 배너가 뜬다.
    # 그게 맞는 상태이며, 규칙 5가 동작한다는 증거다.
    note: >-
      읍면동 유권자 프로파일(A-001). 선관위 개표결과와 행안부 주민등록 인구라는
      이미 공표된 집계의 재표현이며, 최소 집계 단위는 행정동이라 개인 식별 정보가
      들어 있지 않다. 캠프 내부 열람을 전제로 한다 — 화면을 외부로 내보내면
      사전선거운동 기간 판정 대상이 된다.
