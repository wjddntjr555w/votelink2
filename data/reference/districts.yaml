  - id: seoul_songpa_gap
    name: 서울 송파구 갑
    sido: 서울특별시
    sigungu: 송파구
    # 출처: 사용자 제공 (2026-09) → 선관위 자료로 대조 완료 (2026-09-02).
    #
    # 대조 방법: 제22대 총선 개표결과 CSV(선관위 확정본)의 `선거구명=송파구갑` 행에서
    # `법정읍면동명` 을 뽑아 아래 9개와 비교했다. 차집합이 양쪽 다 공집합이었다.
    # 같은 파일에서 송파구을 8개, 송파구병 10개가 따로 나오므로 경계도 확인됐다.
    #
    # 이 대조가 중요한 이유: 목록이 틀리면 옆 지역구 데이터가 섞여 들어와도
    # 아무 에러가 나지 않는다. 인구도 득표도 그럴듯한 숫자가 나온다.
    # 선거구 획정이 바뀌면 새 선거의 개표결과 CSV로 다시 대조한다 (docs/SETUP.md §3).
    source: nec_2024_verified
    emd:
      # code: 전부 mois_population 의 실제 API 응답(admmCd, lv=3 송파구 조회)에서 나온 값이다.
      # 2026-09-01 수집분(기준월 2024-12) = data/records/mois_population.jsonl.
      # 추정하거나 손으로 만든 값이 하나도 없다 — 틀린 코드는 에러 없이
      # 다른 동네에 데이터를 붙이기 때문이다.
      #
      # 풍납1·2동은 앞선 세션에서 이미 확정돼 있던 값과 일치했다. 나머지 7개는
      # 같은 응답에서 나왔으므로 이 교차 검증이 짝 전체를 보증한다.
      - { name: 풍납1동, org_code: "3230040", code: "1171051000" }
      - { name: 풍납2동, org_code: "3230041", code: "1171052000" }
