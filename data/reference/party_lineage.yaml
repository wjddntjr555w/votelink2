# 대선 후보 → 진영(camp) 매핑.
#
# 1992년 민자당부터 2025년 국민의힘까지 정당명이 회차마다 다르다. 동별 성향을
# 시계열로 비교하려면 공통 축으로 정규화해야 하는데, **이건 정치적 판단이다.**
# 코드에 숨기지 않고 여기 데이터로 둔다 (districts.yaml 과 같은 원칙).
# 이견이 있으면 이 파일만 고치고 `votelink analyze voter_profile` 을 다시 돌린다.
#
# 키는 election + candidate 다. **정당이 아니다.**
#   - 2002년(16대) 개표자료에는 정당 열 자체가 없다. 원본 헤더가 후보명만 준다.
#   - 같은 사람이 회차마다 다른 위치에 있다 (이회창: 1997·2002 한나라당 → 2007 무소속).
# party 필드는 참고용이며 매칭에 쓰이지 않는다.
#
# camp 값 4가지:
#   conservative  보수
#   progressive   진보
#   centrist      중도 — **3분류로 뭉개지 않는 이유가 여기 있다.** 2017년 안철수
#                 22.2% + 유승민 8.8% 를 other 로 넣으면 그 해 보수 지지가 실제보다
#                 붕괴한 것처럼 보인다. 중도표 이동은 송파갑 같은 접전지에서
#                 가장 중요한 신호라 별도 축으로 둔다.
#   other         위 셋으로 분류하기 어려운 군소·단일이슈 후보
#
# **분류 기준은 '당의 이념'이 아니라 '그 후보 득표층의 이념 위치'다.**
# 우리가 하려는 일은 득표를 진영 축으로 환산하는 것이지 정당을 분류하는 게 아니다.
# 그래서 강령·계보보다 출구조사·투표행태 연구를 우선한다. 둘이 갈릴 때는 표를 따른다.
#
# **매핑에 없는 후보는 격리된다.** 조용히 other 로 떨어뜨리면 '매핑 누락'과
# '실제 군소후보'를 구분할 수 없기 때문이다. 새 선거를 붙이면 여기도 채운다.
#
# --- 어떻게 확정했나 (2026-09-03) -------------------------------------------
#
# 논쟁적인 5건을 놓고 **먼저 민감도를 쟀다.** 각 항목을 대안값으로 바꿔 돌렸을 때
# 동별 순위·추세·스윙이 실제로 바뀌는지 계산했다. 결과:
#
#   1992 정주영 (20.1%)  →  순위 0 · 추세 0 · 스윙 0.0%p   결과 불변
#   1997 이인제 (10.8%)  →  순위 0 · 추세 0 · 스윙 0.0%p   결과 불변
#   2007 이인제 ( 0.3%)  →  순위 0 · 추세 0 · 스윙 0.5%p   결과 불변
#   2017 유승민 ( 8.8%)  →  순위 0 · 추세 0 · 스윙 11.0%p  스윙만 흔듦
#   2025 이준석 ( 9.8%)  →  순위 5/9개 동 뒤집힘           결정적
#
# 앞의 3건은 어느 쪽으로 분류하든 산출물이 같다. 득표 20.1%인 정주영조차 그렇다 —
# 1992년 값이 시계열의 최대·최소 어느 쪽도 아니고, 순위·추세는 최근 3회만 보기 때문.
# **논쟁이 결과를 바꾸지 않으면 논쟁이 아니다.** 초안값으로 확정했다.
#
# 뒤의 2건만 근거를 찾았고, 둘 다 초안값을 뒷받침했다 (각 항목 주석 참조).

