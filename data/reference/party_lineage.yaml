  # === 국회의원선거(총선) 지역구 — 서울 47개 선거구, 22대(2024)만 (D-003) ==========
  #
  # 2026-09-05 추가. D-002 로 nec_archive_assembly 가 22대를 47개 선거구로
  # 확장한 뒤, voter_profile 이 이 선거구들을 분석하려면 그 지역구 후보의
  # 진영 매핑이 있어야 한다. 22대 전국 단일 파일(선관위)에서 각 선거구 블록의
  # 후보 전원(정당·이름)을 그대로 추출했다 — 누락 없음.
  #
  # 분류는 정당 단위로 한다(대선처럼 후보 개인 조사를 47곳마다 하지 않는다).
  # 같은 기준(득표층의 이념 위치)을 정당에 적용한 결과:
  #   더불어민주당                → progressive (기존 송파갑 판단과 동일)
  #   국민의힘                    → conservative
  #   개혁신당                    → centrist (이 파일이 이미 이준석·안철수를
  #                                 centrist 로 두는 것과 같은 논리 — 2030 이탈표 성격)
  #   새로운미래                  → centrist (2024년 신설, 더불어민주당 이탈·반(反)
  #                                 양극화 표방 — 개혁신당과 같은 성격의 이탈)
  #   녹색정의당·진보당           → progressive (기존 심상정·김재연 판단과 동일 계보)
  #   그 외 군소·무소속           → other (개별 조사 없이 '군소·종교·무소속 → other'
  #                                 원칙을 그대로 적용 — 표가 작아 민감도가 낮다)
  #
  # **동명이인 주의**: 총선은 지역구 300여 곳이 같은 election_id 를 공유해서
  # 이름이 우연히 겹칠 수 있다. 2024년 서울에서 유일하게 '이상규'가 두 곳
  # (성북구을 국민의힘 / 관악구을 진보당)에 있다 — district 필드로 구분했다
  # (votelink/reference/party_lineage.py, camp_of 가 district_name 우선 조회).
  #
  # 위 두 기준(정당 단위 분류, 개별조사 생략)이 이번 배치 전체의 판단 근거다 —
  # 항목마다 반복하지 않는다. 이견이 있으면 이 블록만 고치고 다시 분석한다.

