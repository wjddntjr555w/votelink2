  # === 국회의원선거(총선) 지역구 — 19~21대(2012~2020), D-004 로 확장된 선거구 (D-005) ==
  #
  # 2026-09-05 추가. D-004 로 nec_archive_assembly 가 19~21대를 45개 선거구로
  # 확장한 뒤, voter_profile 이 그 회차들을 분석하려면 후보 진영 매핑이 있어야
  # 한다. 각 회차의 선거구별 파일에서 후보 전원(정당·이름)을 그대로 추출했다 —
  # 누락 없음. 송파구갑은 이미 채워져 있어 다시 넣지 않았다.
  #
  # 분류는 정당 단위로 한다(D-003 과 같은 기준 — 47곳마다 후보 개인 조사는
  # 안 한다). 새로 나온 정당들:
  #   민주통합당(2012)·더불어민주당              → progressive
  #   새누리당·자유선진당·미래통합당·우리공화당   → conservative
  #   국민의당(2016)·민생당(2020)                → centrist (이 파일이 이미
  #                                                 안철수 국민의당을 centrist 로
  #                                                 두는 것과 같은 논리)
  #   통합진보당·민중연합당·민중당·진보신당·
  #   노동당·녹색당·기본소득당                    → progressive (기존 계보)
  #   그 외 군소·무소속(정통민주당·국민생각·미래연합·
  #   국가혁명배당금당 등)                        → other
  #
  #   **주의**: 2012년의 '국민의 힘'(가운데 띄어쓰기 있음, 군소정당)은 2020년에
  #   창당된 오늘날의 '국민의힘'과 무관한 별개 정당이다 — other 로 둔다.
  #
  # **동명이인**: 2020년(21대) 서울에서 '김종민'(동대문구을 민중당 / 은평구을
  # 정의당)과 '김용태'(구로구을 미래통합당 / 관악구갑 국가혁명배당금당) 두 쌍이
  # 겹친다 — district 필드로 구분했다.

